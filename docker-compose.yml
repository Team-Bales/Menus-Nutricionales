services:
  postgres:
    image: postgres:16
    container_name: menus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: menus_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: menus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: src/Menus.Api/Dockerfile
    container_name: menus_api
    restart: unless-stopped
    depends_on:
      - postgres
      - mongo
      - redis
    env_file:
      - .env
    ports:
      - "8080:8080"

  client:
    build:
      context: .
      dockerfile: src/Menus.Client/Dockerfile
    container_name: menus_client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5000:80"

volumes:
  postgres_data:
  mongo_data:
