sonar.projectKey=Team-Bales_Menus-Nutricionales
sonar.organization=team-bales

sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**

# Program.cs de Menus.Client arranca el host real de Blazor WebAssembly (RunAsync) y depende del runtime del
# navegador (interop JS); no se puede ejercitar desde xUnit sin un navegador real, a diferencia del Program.cs
# de Menus.Api, que sí se cubre con WebApplicationFactory en las pruebas de integración.
sonar.coverage.exclusions=src/Menus.Client/Program.cs

sonar.cs.opencover.reportsPaths=coverage/*/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=coverage/*.trx
