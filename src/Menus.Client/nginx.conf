server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx.
    server_tokens off;

    # Cabeceras de seguridad del cliente (#294, §13.3). La CSP deja cargar el runtime de Blazor WASM y sus estilos,
    # y solo permite hablar con el mismo origen: en Docker, /api/ se proxya al contenedor de la API.
    # Blazor publica scripts inline en index.html (el importmap y otros del propio runtime); sus hashes cambian en
    # cada build, así que se permite 'unsafe-inline' solo en script-src. El resto de la CSP sigue estricta.
    # HSTS solo lo aplican los navegadores cuando la conexión llega por HTTPS (terminación TLS delante de nginx).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin add_header propio: nginx solo hereda las cabeceras del bloque server si el location no declara
        # ninguna, y aquí interesan todas (incluidas HSTS y la CSP). La API añade las suyas; cuando llegan dos CSP,
        # el navegador aplica la intersección y la de la API (default-src 'none') es la más restrictiva.
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
